name: Notificar a ntfy.sh

on:
  push:
    branches:
      - main  # Solo se ejecuta cuando subas algo a la rama main

jobs:
  notificar:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar código
        uses: actions/checkout@v3

      - name: Ejecutar Hola Mundo
        run: node hola.js

      - name: Enviar notificación a ntfy.sh
        run: |
          curl -d "🚀 Se ha subido nuevo código al repositorio en la rama main." https://ntfy.sh/devops-itla
